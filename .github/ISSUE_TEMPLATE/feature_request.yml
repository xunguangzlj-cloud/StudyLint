name: Feature request
description: 提议新的检查规则或解析能力
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请先描述用户问题，而不是直接描述实现方案。
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: 最小输入与期望输出
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 为什么属于StudyLint的范围
    validations:
      required: true

