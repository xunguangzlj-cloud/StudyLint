[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studylint"
version = "0.6.0"
description = "A local-first guard against hallucinated study notes and paper citations."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "xunguangzlj-cloud" }]
keywords = ["education", "citations", "study-notes", "linter", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
]
dependencies = [
  "PyMuPDF>=1.24",
  "python-pptx>=1.0",
  "python-docx>=1.1",
  "rapidfuzz>=3.9",
]

[project.urls]
Homepage = "https://github.com/xunguangzlj-cloud/StudyLint"
Repository = "https://github.com/xunguangzlj-cloud/StudyLint"
Issues = "https://github.com/xunguangzlj-cloud/StudyLint/issues"
Author = "https://github.com/xunguangzlj-cloud"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
studylint = "studylint.cli:main"
studylint-gui = "studylint.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/studylint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
