[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studylint"
version = "0.1.0"
description = "A deterministic linter for citation-backed study notes."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "xunguangzlj-cloud" }]
keywords = ["education", "citations", "study-notes", "linter", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
]
dependencies = [
  "PyMuPDF>=1.24",
  "python-pptx>=1.0",
  "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
studylint = "studylint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/studylint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
